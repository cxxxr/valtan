name: SACLA Tests

on:
  workflow_dispatch:
    inputs:
      run_ansi:
        description: Run upstream ANSI tests (full runs require complete coverage and 90% success)
        type: boolean
        default: false
      ansi_category:
        description: ANSI category; leave empty for all categories
        type: string
        default: ''
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup Quicklisp
        run: |
          nix develop --command bash -c '
            curl -O https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
              --load quicklisp.lisp \
              --eval "(quicklisp-quickstart:install)" \
              --eval "(quit)"
          '

      - name: Build valtan
        run: |
          nix develop --command bash -c '
            sbcl --non-interactive \
              --load ~/quicklisp/setup.lisp \
              --eval "(ql:quickload :valtan-cli)" \
              --eval "(asdf:make :valtan-cli/executable)" \
              --eval "(quit)"
          '

      - name: Build tests
        run: |
          nix develop --command bash -c '
            cd tests
            npm install
            ../valtan build tests.system
            npx vite build
          '

      - name: Build and verify ANSI test adapter
        run: |
          nix develop --command bash -c '
            set -e
            cd tests
            npm run build:ansi
            npm run test:ansi:harness
            sbcl --script ansi/generate-manifest.lisp > /tmp/ansi-manifest.json
            cmp ansi/manifest.json /tmp/ansi-manifest.json
          '

      - name: Run SACLA tests
        id: run-tests
        run: |
          nix develop --command bash -c '
            cd tests
            node dist/tests.js 2>&1 | tee test-output.txt

            PASS=$(grep "TOTAL:" test-output.txt | sed "s/.*Pass=\([0-9]*\).*/\1/")
            FAIL=$(grep "TOTAL:" test-output.txt | sed "s/.*Fail=\([0-9]*\).*/\1/")
            RATE=$(grep "Pass Rate:" test-output.txt | sed "s/.*: \([0-9]*\)%.*/\1/")

            echo "pass=$PASS" >> $GITHUB_OUTPUT
            echo "fail=$FAIL" >> $GITHUB_OUTPUT
            echo "rate=$RATE" >> $GITHUB_OUTPUT

            # Generate visual progress bar
            make_bar() {
              local rate=$1
              local filled=$((rate / 10))
              local empty=$((10 - filled))
              local bar=""
              for ((i=0; i<filled; i++)); do bar+="█"; done
              for ((i=0; i<empty; i++)); do bar+="░"; done
              echo "$bar"
            }

            # Parse results into categorized files
            PERFECT=""
            NEEDS_WORK=""
            CRITICAL=""

            while IFS= read -r line; do
              file=$(echo "$line" | sed "s/^--- //" | awk -F: "{print \$1}")
              pass=$(echo "$line" | sed "s/.*Pass=\\([0-9]*\\).*/\\1/")
              fail=$(echo "$line" | sed "s/.*Fail=\\([0-9]*\\).*/\\1/")
              total=$((pass + fail))
              if [ "$total" -gt 0 ]; then
                rate=$((pass * 100 / total))
              else
                rate=0
              fi

              bar=$(make_bar $rate)

              if [ "$rate" -eq 100 ]; then
                PERFECT+="| $file | $bar | $rate% | $pass |\\n"
              elif [ "$rate" -ge 50 ]; then
                NEEDS_WORK+="| $file | $bar | $rate% | $fail |\\n"
              else
                CRITICAL+="| $file | $bar | $rate% | $fail |\\n"
              fi
            done < <(grep -E "^--- (must-|should-|desirable-)" test-output.txt)

            # Overall progress bar
            OVERALL_BAR=$(make_bar $RATE)

            # Write summary
            echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Overall: $RATE% ($PASS/$((PASS+FAIL)))** \`$OVERALL_BAR\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Perfect tests (table)
            if [ -n "$PERFECT" ]; then
              PERFECT_COUNT=$(echo -e "$PERFECT" | grep -c "^|" || true)
              echo "### ✅ Perfect ($PERFECT_COUNT tests)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Test | Progress | Rate | Pass |" >> $GITHUB_STEP_SUMMARY
              echo "|:-----|:--------:|-----:|-----:|" >> $GITHUB_STEP_SUMMARY
              echo -e "$PERFECT" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # Needs work tests (table)
            if [ -n "$NEEDS_WORK" ]; then
              NEEDS_COUNT=$(echo -e "$NEEDS_WORK" | grep -c "^|" || true)
              echo "### ⚠️ Needs Work ($NEEDS_COUNT tests)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Test | Progress | Rate | Fail |" >> $GITHUB_STEP_SUMMARY
              echo "|:-----|:--------:|-----:|-----:|" >> $GITHUB_STEP_SUMMARY
              echo -e "$NEEDS_WORK" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # Critical tests (table)
            if [ -n "$CRITICAL" ]; then
              CRITICAL_COUNT=$(echo -e "$CRITICAL" | grep -c "^|" || true)
              echo "### ❌ Critical ($CRITICAL_COUNT tests)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Test | Progress | Rate | Fail |" >> $GITHUB_STEP_SUMMARY
              echo "|:-----|:--------:|-----:|-----:|" >> $GITHUB_STEP_SUMMARY
              echo -e "$CRITICAL" >> $GITHUB_STEP_SUMMARY
            fi
          '

      - name: Require complete SACLA coverage and 90 percent success
        run: node tests/check-conformance.mjs tests/test-output.txt

      - name: Run upstream ANSI tests on request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ansi }}
        env:
          ANSI_CATEGORY: ${{ inputs.ansi_category }}
        run: |
          if [ -n "$ANSI_CATEGORY" ]; then
            node tests/ansi/run.mjs --category "$ANSI_CATEGORY" --timeout 7200 --output tests/ansi-results.json
          else
            ansi_status=0
            node tests/ansi/run.mjs --jobs 2 --timeout 7200 --output tests/ansi-results.json || ansi_status=$?
            if [ "$ansi_status" -gt 1 ]; then exit "$ansi_status"; fi
            node tests/ansi/check-conformance.mjs tests/ansi-results.json tests/dist-ansi/ansi.js
          fi

      - name: Upload ANSI report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_ansi }}
        uses: actions/upload-artifact@v4
        with:
          name: ansi-test-results
          path: tests/ansi-results.json
          if-no-files-found: warn
